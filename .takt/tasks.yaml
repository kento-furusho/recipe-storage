      # タスク指示書: 画像差し替え時のレシピ自動認識の再実行

      ## 概要

      画像を差し替えた際に、レシピ自動認識（画像からレシピを判定する機能）が再度実行されるようにする。

      ## 現状の挙動

      - 画像を**新規追加**した時 → レシピ自動認識が実行される ✅
      - 既存画像を別の画像に**差し替え**た時 → レシピ自動認識が実行されない ❌

      ## 期待する挙動

      - 画像差し替え時にも、新規追加時と同様にレシピ自動認識が再実行される

      ## 作業内容

      ### 優先度: 高

      1. **画像新規追加時のレシピ判定トリガーの特定**
         - 画像新規追加のフローを調査し、レシピ自動認識がどこで・どのように呼び出されているかを特定する

      2. **画像差し替えフローの調査**
         - 画像差し替え処理のコードを特定する
         - 新規追加フローとの差分を確認し、なぜレシピ判定が走らないのかの原因を特定する

      3. **画像差し替え時にレシピ自動認識を実行するよう修正**
         - 新規追加時と同じレシピ判定ロジックが、差し替え時にも呼び出されるように実装する

      ## 確認方法

      1. 画像を新規追加 → レシピ自動認識が実行されることを確認（既存動作が壊れていないこと）
      2. 既存画像を別の画像に差し替え → レシピ自動認識が再実行されることを確認
