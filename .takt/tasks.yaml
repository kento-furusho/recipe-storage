    content: |-
      # タスク指示書: レシピのカテゴリー機能の追加

      ## 概要

      レシピをカテゴリーごとにまとめて管理できる機能を新規追加する。

      ## 要件

      ### カテゴリー管理
      - ユーザーがカテゴリーを自由に**作成・編集・削除**できる
      - カテゴリー名はユーザーが任意に設定

      ### レシピとカテゴリーの関連付け
      - 1つのレシピに**複数のカテゴリー**を付けられる（多対多の関係）
      - カテゴリー未設定のレシピも許容する

      ### 表示
      - **フォルダのような階層構造**で表示する
      - カテゴリーをタップ → そのカテゴリーに属するレシピ一覧を表示
      - 複数カテゴリーに属するレシピは、それぞれのカテゴリー内に表示される

      ## 作業内容

      ### 優先度: 高

      1. **データモデルの設計・実装**
         - カテゴリーのデータモデル（名前、IDなど）
         - レシピとカテゴリーの多対多リレーション

      2. **カテゴリーCRUD機能**
         - カテゴリーの作成・編集（名前変更）・削除
         - カテゴリー削除時のレシピへの影響を考慮（レシピ自体は削除しない）

      3. **レシピへのカテゴリー付与機能**
         - レシピにカテゴリーを追加・削除するUI/ロジック

      ### 優先度: 中

      4. **カテゴリー別表示（フォルダ階層UI）**
         - カテゴリー一覧画面（フォルダ一覧のような表示）
         - カテゴリーをタップしてレシピ一覧を表示
         - カテゴリー未設定のレシピの扱いを決定（例:「未分類」として表示）

      ## 確認方法

      1. カテゴリーを作成・編集・削除できること
      2. レシピに複数のカテゴリーを付与・解除できること
      3. カテゴリー別のフォルダ階層表示でレシピが正しく表示されること
      4. 複数カテゴリーに属するレシピが各カテゴリー内に表示されること
      5. カテゴリー削除時にレシピ自体が消えないこと
